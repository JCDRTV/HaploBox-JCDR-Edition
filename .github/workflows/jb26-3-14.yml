name: JB26.3.14 Team Invite
on:
  push:
    branches: [dev/jb26.3.14-auto-accept]
    paths: ['distribution/jcdrbox-auto-accept/build.py', 'distribution/jcdrbox-auto-accept/test_accept.lua', '.github/workflows/jb26-3-14.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5818b2a04c2027c1fc4ccfccda94235dbfba52a0
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-auto-accept/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-auto-accept/output/
          git diff --cached --quiet || git commit -m "JB26.3.14 verified auto accept candidate"
          git push origin HEAD:dev/jb26.3.14-auto-accept
