name: JB26.3.16 Team Invite
on:
  push:
    branches: [dev/jb26.3.16-accept-realm]
    paths: ['distribution/jcdrbox-accept-realm/build.py', 'distribution/jcdrbox-accept-realm/test_accept.lua', '.github/workflows/jb26-3-16.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7248dcf363152aadc47ad161631064fea2858a89
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-accept-realm/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-accept-realm/output/
          git diff --cached --quiet || git commit -m "JB26.3.16 verified auto accept candidate"
          git push origin HEAD:dev/jb26.3.16-accept-realm
