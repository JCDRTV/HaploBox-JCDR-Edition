name: JB26.3.2 Central Register
on:
  push:
    branches: [dev/jb26.3.2-central-register]
    paths: ['distribution/jcdrbox-central/**', '.github/workflows/jb26-3-2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python3 distribution/jcdrbox-central/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-central/output/
          git diff --cached --quiet || git commit -m "JB26.3.2 verified central register candidate"
          git push origin HEAD:dev/jb26.3.2-central-register
