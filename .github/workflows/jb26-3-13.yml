name: JB26.3.13 Team Invite
on:
  push:
    branches: [dev/jb26.3.13-team-invite]
    paths: ['distribution/jcdrbox-team-invite/build.py', 'distribution/jcdrbox-team-invite/test_tm_ui.lua', 'distribution/jcdrbox-team-invite/test_invite.lua', '.github/workflows/jb26-3-13.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 371343771cf89aa10647a62c47da802dcbdb482a
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-team-invite/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-team-invite/output/
          git diff --cached --quiet || git commit -m "JB26.3.13 verified team invite candidate"
          git push origin HEAD:dev/jb26.3.13-team-invite
