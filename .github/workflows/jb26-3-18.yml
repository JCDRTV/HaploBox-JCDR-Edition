name: JB26.3.18 Team Invite
on:
  push:
    branches: [dev/jb26.3.18-invite-event]
    paths: ['distribution/jcdrbox-invite-event/build.py', 'distribution/jcdrbox-invite-event/test_accept.lua', '.github/workflows/jb26-3-18.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 620c74197426dd4ca79e0da799e9df0c01477b0c
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-invite-event/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-invite-event/output/
          git diff --cached --quiet || git commit -m "JB26.3.18 verified auto accept candidate"
          git push origin HEAD:dev/jb26.3.18-invite-event
