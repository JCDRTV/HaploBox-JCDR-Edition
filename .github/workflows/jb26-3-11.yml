name: JB26.3.11 TM Screen Layout
on:
  push:
    branches: [dev/jb26.3.11-tm-preview]
    paths: ['distribution/jcdrbox-tm-preview/build.py', 'distribution/jcdrbox-tm-preview/test_tm_ui.lua', '.github/workflows/jb26-3-11.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: db8a513da963a00fb0b57f23b1b1a8e043e9acbc
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-tm-preview/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-tm-preview/output/
          git diff --cached --quiet || git commit -m "JB26.3.11 verified TM screen layout candidate"
          git push origin HEAD:dev/jb26.3.11-tm-preview
