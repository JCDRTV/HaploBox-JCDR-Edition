name: JB26.3.23 Macro Management
on:
  push:
    branches: [dev/jb26.3.23-macro-management]
    paths: ['distribution/jcdrbox-macro-management/build.py', 'distribution/jcdrbox-macro-management/test_macro.lua', 'distribution/jcdrbox-macro-management/catalog.lua', '.github/workflows/jb26-3-23.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-macro-management/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-macro-management/output/
          git diff --cached --quiet || git commit -m "JB26.3.23 verified macro candidate"
          git push origin HEAD:dev/jb26.3.23-macro-management
