name: JB26.3.9 Scroll Spacing
on:
  push:
    branches: [dev/jb26.3.9-scroll-spacing]
    paths: ['distribution/jcdrbox-scroll-spacing/build.py', 'distribution/jcdrbox-scroll-spacing/test_ui.lua', '.github/workflows/jb26-3-9.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cb9bb894c953dd386d902854e7c8980b5d87cbfc
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-scroll-spacing/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-scroll-spacing/output/
          git diff --cached --quiet || git commit -m "JB26.3.9 verified scrollbar spacing candidate"
          git push origin HEAD:dev/jb26.3.9-scroll-spacing
