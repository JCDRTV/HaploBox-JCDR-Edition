name: Publish Profession Guide Visible Quick Menu TEST

on:
  push:
    branches: [main]
    paths:
      - distribution/profession-guide/build_visible_menu.py
      - .github/workflows/profession-visible-menu-test.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profession-visible-menu-test
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and patch first Quick Menu row
        run: python distribution/profession-guide/build_visible_menu.py
      - name: Publish complete TEST ZIP + manifest for the one-click updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add distribution/test/manifest.json distribution/test/HaploBox_HF26.20.47_Profession_Guide_Visible_Menu_TEST.zip
          if ! git diff --cached --quiet; then
            git commit -m 'HF26.20.47 TEST: Profession Guide first in Quick Menu'
            git push origin HEAD:main
          fi
