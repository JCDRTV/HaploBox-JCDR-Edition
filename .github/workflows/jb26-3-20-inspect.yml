name: Inspect JB26.3.19 packaged sources
on:
  push:
    branches: [dev/jb26.3.20-party-loot]
    paths: ['.github/workflows/jb26-3-20-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib
          p=Path('distribution/jcdrbox-legacy-accept/output/JCDRbox_JB26.3.19_Legacy_Accept_TEST.zip')
          with ZipFile(p) as z:
              for n in z.namelist():
                  if n.endswith('.lua'):
                      b=z.read(n)
                      if n in ['HaploBox/Party.lua','HaploBox/Core.lua','HaploBox/TeamPlanner.lua','HaploBox/RegisterSync.lua','HaploBox/RegisterPeerSync.lua','HaploBox/TeamManagement.lua','HaploBox/Gameplay.lua','HaploBox/ControlBar.lua'] or b'function HB.CheckAutoLoot' in b or b'function HB.TeamOrder' in b:
                          dest=Path('distribution/jcdrbox-party-loot/inspection')/n
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(b)
                          print(n)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-party-loot/inspection
          git commit -m "Inspect immutable JB26.3.19 packaged Lua sources"
          git push origin HEAD:dev/jb26.3.20-party-loot
