name: JB26.3.8 Flat Scroll
on:
  push:
    branches: [dev/jb26.3.8-flat-scroll]
    paths: ['distribution/jcdrbox-flat-scroll/build.py', 'distribution/jcdrbox-flat-scroll/test_ui.lua', '.github/workflows/jb26-3-8.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9de6465c79e4f309b61bf1f044cc86853542b2a6
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-flat-scroll/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-flat-scroll/output/
          git diff --cached --quiet || git commit -m "JB26.3.8 verified flat scrollbar candidate"
          git push origin HEAD:dev/jb26.3.8-flat-scroll
