name: JB26.3.20 Party and Loot
on:
  push:
    branches: [dev/jb26.3.20-party-loot]
    paths: ['distribution/jcdrbox-party-loot/build.py', 'distribution/jcdrbox-party-loot/test_party_loot.lua', '.github/workflows/jb26-3-20.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c6758cc58804ec955aae4d3bdd72407785efdffa
          path: base-manifest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop
          python3 distribution/jcdrbox-party-loot/build.py
      - name: Save tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/jcdrbox-party-loot/output/
          git diff --cached --quiet || git commit -m "JB26.3.20 verified party loot candidate"
          git push origin HEAD:dev/jb26.3.20-party-loot
